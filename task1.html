<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1: Product Showcase Card</title>
  <style>
    /* 1. Box Model Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 2. Mobile Base Styles (1-Column Stack) */
    .product-card {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      display: grid;
      grid-template-columns: 1fr;
    }

    .image-box {
      position: relative;
      background-color: #f1f5f9;
      min-height: 260px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .image-box:hover img {
      transform: scale(1.04);
    }

    .badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: #e0f2fe;
      color: #0284c7;
      border: 1px solid #7dd3fc;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      letter-spacing: 0.05em;
      z-index: 2;
    }

    .details-box {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-tag {
      background: #f1f5f9;
      color: #475569;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
    }

    .rating {
      font-size: 0.9rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .rating span {
      color: #f59e0b;
    }

    .product-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0.75rem 0 0.5rem;
    }

    .product-desc {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .features-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .features-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .feature-pill {
      background: #f0f9ff;
      color: #0369a1;
      border: 1px solid #bae6fd;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .bottom-shelf {
      border-top: 1px solid #e2e8f0;
      padding-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .price {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .tax-note {
      font-size: 0.8rem;
      color: #64748b;
    }

    .add-btn {
      width: 100%;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .add-btn:hover {
      background-color: #0369a1;
    }

    .add-btn:active {
      transform: scale(0.96);
    }

    /* 3. Desktop Media Query Breakpoint (> 768px) */
    @media (min-width: 768px) {
      .product-card {
        grid-template-columns: 1fr 1fr;
      }

      .details-box {
        padding: 2rem;
      }

      .bottom-shelf {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .add-btn {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <main class="product-card">
    <div class="image-box">
      <span class="badge">POPULAR</span>
      <img src="https://images.unsplash.com/photo-1593642632823-8f785ba67e45?auto=format&fit=crop&w=800&q=80" alt="Desk Workspace Mat">
    </div>

    <div class="details-box">
      <div>
        <div class="top-row">
          <span class="category-tag">Workspace</span>
          <div class="rating"><span>★</span> 4.9</div>
        </div>

        <h1 class="product-title">Desk Workspace Mat</h1>
        <p class="product-desc">
          Water-resistant vegan leather desk pad designed for smooth mouse tracking and clutter-free daily setups.
        </p>

        <div class="features-label">Features</div>
        <div class="features-list">
          <span class="feature-pill">Anti-Slip Base</span>
          <span class="feature-pill">Waterproof</span>
          <span class="feature-pill">900 × 400 mm</span>
        </div>
      </div>

      <div class="bottom-shelf">
        <div>
          <div class="price">₹1,499</div>
          <div class="tax-note">Tax included</div>
        </div>
        <button class="add-btn">Add to Bag</button>
      </div>
    </div>
  </main>
</body>
</html>
